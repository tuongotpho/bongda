# Đẩy code lên main → kiểm tra (typecheck + test) → build → deploy lên https://bongda-npsc.web.app
# Mở PR → chỉ kiểm tra + build, không deploy.
# Test đỏ thì KHÔNG deploy (giống rơ-le chặn đóng điện khi đo cách điện không đạt).
name: Kiểm tra & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cấu hình web Firebase (không phải mật khẩu) — lưu ở Settings > Secrets and variables > Actions > Variables
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Chặn build nhầm sang chế độ thử / database dùng chung
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ "$VITE_FIREBASE_DATABASE_ID" != "bongda" ]; then
            echo "::error::Thiếu biến VITE_FIREBASE_* hoặc VITE_FIREBASE_DATABASE_ID khác 'bongda'"
            exit 1
          fi
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-from-ai
          channelId: live
